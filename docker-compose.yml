services:
  ncpr-web:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: ncpr-web
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - .env
    environment:
      NCPR_DB_DIR: /data
      NCPR_ARCHIVE_DIR: /archive
      HOME: /tmp/app-home
    volumes:
      - ${DB_ROOT:-./data}:/data
      - ${ARCHIVE_ROOT:-${DB_ROOT:-./data}}:/archive
    network_mode: "host"
    restart: unless-stopped
    command: ["gunicorn", "--bind", "127.0.0.1:6001", "--workers", "1", "app.web:create_app()"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:6001/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ncpr-collector:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: ncpr-collector
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - .env
    environment:
      NCPR_DB_DIR: /data
      NCPR_ARCHIVE_DIR: /archive
      HOME: /tmp/app-home
    volumes:
      # Two roots on purpose.
      #
      # /data    SQLite + lock + HALTED. Keep on a LOCAL filesystem: this
      #          file holds the daily counter that enforces the rate cap,
      #          and SQLite needs working POSIX locks. Never put it on a
      #          CIFS/SMB mount.
      # /archive raw XML, exports, cached WSDL. Append-only, so a shared
      #          folder is fine and makes the output readable and copyable
      #          without touching the collector.
      #
      # ARCHIVE_ROOT falls back to DB_ROOT, so a single-path setup works.
      - ${DB_ROOT:-./data}:/data
      - ${ARCHIVE_ROOT:-${DB_ROOT:-./data}}:/archive
    network_mode: "host"
    # restart: "no" is deliberate and load-bearing.
    #
    # The daily cap is enforced against a monitored, IP-allowlisted government
    # service. An auto-restarting container would resume after a hard stop --
    # exactly the situation (403/429) where a human must confirm allowlist
    # status with NCPR before another request is sent. The collector also
    # writes a HALTED file and refuses to start while it exists, so a restart
    # policy here would fight a safety mechanism rather than help.
    restart: "no"
    command: ["python", "-m", "app.main", "collect"]
