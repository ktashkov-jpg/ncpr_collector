[pytest]
# /app is root-owned from the image build while the container runs as
# HOST_UID, so pytest cannot write its cache next to the code. Point it at
# /tmp instead. Without this the suite still passes but emits two
# PytestCacheWarning lines, which is noise in the one output an operator
# reads to decide whether a fresh clone is trustworthy.
cache_dir = /tmp/.pytest_cache
testpaths = tests
